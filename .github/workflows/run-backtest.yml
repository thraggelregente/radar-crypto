name: Run backtest

on:
  workflow_dispatch: {}
  push:
    branches: [ 'experiment/vectorbt-btc-1h' ]
  # schedule: solo corre en la rama por defecto; descomentá cuando esté mergeado a main
  # schedule:
  #   - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.10"
          channels: conda-forge
          channel-priority: strict
          activate-environment: research-env

      - name: Install dependencies
        run: |
          conda install -y -c conda-forge \
            "numpy<2" pandas matplotlib "plotly=5.24.1" vectorbt
          pip install ccxt python-dotenv requests

      - name: Debug versions
        run: |
          python -c "import sys; print('python', sys.version)"
          python -c "import vectorbt as vbt, plotly; print('vectorbt', vbt.__version__); print('plotly', plotly.__version__)"
          conda list | grep -E 'vectorbt|plotly|numpy|numba|pandas'

      - name: Run backtest
        run: python research/compare.py

      - name: Show results
        if: always()
        run: |
          echo "=== BACKTEST RESULTS ==="
          if [ -f research/results_v2.json ]; then
            cat research/results_v2.json
          else
            echo "No results file produced."
          fi

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: research/results_v2.json
          if-no-files-found: warn
