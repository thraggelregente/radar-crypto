name: Run backtest (conda/mamba stable - fix channels)

on:
  workflow_dispatch: {}
  push:
    branches: [ 'experiment/vectorbt-btc-1h' ]
  schedule:
    - cron: '0 6 * * *'

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Miniconda (install only)
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          use-mamba: true

      - name: Create research env with mamba (conda-forge)
        shell: bash -l {0}
        run: |
          mamba create -y -n research-env -c conda-forge python=3.10 numpy pandas matplotlib ccxt vectorbt
          conda run -n research-env python -m pip install --upgrade pip

      - name: Install any extra pip deps inside env
        shell: bash -l {0}
        run: |
          conda run -n research-env pip install python-dotenv requests

      - name: Show python & packages (debug)
        shell: bash -l {0}
        run: |
          conda run -n research-env python -c "import sys, platform; print(sys.version); print('platform:', platform.platform())"
          conda run -n research-env python -c "import numpy,pandas,vectorbt,ccxt; print('OK imports')"

      - name: Run backtest
        shell: bash -l {0}
        run: |
          conda run -n research-env python research/compare.py

      - name: Show results (if present)
        run: |
          echo "=== BACKTEST RESULTS ==="
          if [ -f research/results.json ]; then
            cat research/results.json
          else
            echo "No results file produced."
          fi

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: research/results.json
