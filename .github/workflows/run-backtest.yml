name: Run backtest

on:
  workflow_dispatch: {}
  push:
    branches: [ 'experiment/vectorbt-btc-1h' ]
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backtest
        run: |
          python research/compare.py

      - name: Show results (if present)
        run: |
          echo "=== BACKTEST RESULTS ==="
          if [ -f research/results.json ]; then
            cat research/results.json
          else
            echo "No results file produced."
          fi

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: research/results.json
